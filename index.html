<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucid Border</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="lang-switch">
<button onclick="setLang('zh')">中文</button>
<button onclick="setLang('jp')">日本語</button>
</div>

<section class="hero">
<h1 id="title">Lucid Border</h1>
<h2 id="subtitle">明晰夢戰鬥</h2>
<p id="desc">在現實與夢的邊界，少女帶著記憶碎片，對抗自己的夢魘。</p>
<button id="startBtn">進入夢境</button>
</section>

<section class="menu">
<div class="card">
<h3 id="battleTitle">放置戰鬥</h3>
<p id="battleText">角色會自動戰鬥並獲得夢晶。</p>
</div>

<div class="card">
<h3 id="characterTitle">角色</h3>
<p id="characterText">查看已獲得的角色與能力。</p>
</div>

<div class="card">
<h3 id="gachaTitle">抽卡</h3>
<p id="gachaText">消耗夢晶召喚新的角色。</p>
</div>

<div class="card">
<h3 id="bookTitle">圖鑑</h3>
<p id="bookText">收集夢境中的角色與怪物。</p>
</div>
</section>

<script src="script.js"></script>
</body>
</html>
