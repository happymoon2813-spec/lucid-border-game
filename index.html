<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucid Border</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
    <h1>ルシッド・ボーダー</h1>
    <p>夢と現実の境界線</p>

    <div class="menu">
        <button>ゲームスタート</button>
        <button>ガチャ</button>
        <button>キャラクター</button>
        <button>図鑑</button>
    </div>

    <div class="battle">
        <h2>自動戦闘中…</h2>
        <div class="enemy">ナイトメア</div>
        <button>ボスに挑戦</button>
    </div>

    <div class="gacha">
        <h2>ガチャ</h2>
        <button>1回ガチャ</button>
        <button>10連ガチャ</button>
    </div>

    <div class="story">
        <p>これは「明晰夢」に囚われた少女たちの物語。</p>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
